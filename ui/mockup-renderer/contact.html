    <style>
      * { box-sizing: border-box; }

      figcaption span:last-child { color: #8390a5; font-weight: 500; }
      .notes { padding: 18px; display: flex; flex-direction: column; justify-content: center; gap: 10px; background: linear-gradient(145deg,#fff,#f7f9fc); }
      .notes strong { font-size: 15px; }.notes div { color: #66748a; font-size: 11px; line-height: 1.55; }
      .pill { width: fit-content; color: #2563eb; background: #eff6ff; border-radius: 999px; padding: 4px 8px; font-size: 9px; font-weight: 700; }
