# VoltDBServerConfig for the Volt Management Center service (volt-vmc-svc).
# Start with:  VOLTDB_SERVER_CONFIG=./vmc-server.yaml $VMC_HOME/bin/vmc   (or: npm run vmc)
# VMC then serves the web UI and the JSON API (/api/1.0/) on http://localhost:8080.
voltdbHost: localhost
voltdbPort: 21212
voltdbAdminPort: 21211
sslEnabled: false
